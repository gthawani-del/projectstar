const rivals=[];for(let i=0;i<5;i++){const g=new THREE.Group();scene.add(g);g.position.set([-3.1,2.8,-1.8,3.2,.8][i],.05,-14-i*10);const m=new THREE.MeshPhysicalMaterial({color:[0xf0a72c,0x1f8f7b,0x7a45c8,0xd02f70,0x3a70d8][i],metalness:.38,roughness:.2,clearcoat:1});add(new THREE.BoxGeometry(1.65,.4,2.7),m,0,.48,0,g);for(const x of [-.9,.9])for(const z of [-.88,.88]){const w=add(new THREE.CylinderGeometry(.34,.34,.24,14),rubber,x,.35,z,g);w.rotation.z=Math.PI/2}rivals.push(g)}

const clock=new THREE.Clock();let frames=0,ft=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);frames++;ft+=dt;if(ft>.5){document.getElementById('fps').textContent=Math.round(frames/ft);frames=0;ft=0}const goal=running?25:0;worldSpeed+=(goal-worldSpeed)*(1-Math.exp(-dt*1.8));document.getElementById('speed').textContent=Math.round(worldSpeed*5.2);if(running)elapsed+=dt;const mm=84+elapsed;document.getElementById('timer').textContent=`01:${String(Math.floor(mm%60)).padStart(2,'0')}.${String(Math.floor((mm%1)*100)).padStart(2,'0')}`;const k=34,c=10,acc=k*(target-steer)-c*steerVel;steerVel+=acc*dt;steer+=steerVel*dt;kartRoot.position.x=steer;kartRoot.rotation.z=THREE.MathUtils.lerp(kartRoot.rotation.z,-steerVel*.018,1-Math.exp(-dt*10));kartRoot.rotation.y=THREE.MathUtils.lerp(kartRoot.rotation.y,-steerVel*.01,1-Math.exp(-dt*8));rivals.forEach((r,i)=>{r.position.z+=worldSpeed*dt*(.92+i*.02);if(r.position.z>12){r.position.z=-70-i*12;r.position.x=-3.5+Math.random()*7}});const desiredFov=54+worldSpeed*.16;camera.fov=THREE.MathUtils.lerp(camera.fov,desiredFov,1-Math.exp(-dt*2.5));camera.updateProjectionMatrix();camera.position.x=THREE.MathUtils.lerp(camera.position.x,steer*.28,1-Math.exp(-dt*3.4));camera.position.y=3.45+Math.sin(elapsed*5.5)*.018;camera.position.z=8.1-Math.min(1.2,worldSpeed*.028);camera.lookAt(steer*.12,.72,-13);const rp=rain.geometry.attributes.position;for(let i=0;i<rainN;i++){rp.array[i*3+1]-=dt*(12+worldSpeed*.15);rp.array[i*3+2]+=dt*worldSpeed*.25;if(rp.array[i*3+1]<0){rp.array[i*3+1]=15;rp.array[i*3+2]=-Math.random()*120}}rp.needsUpdate=true;composer.render()}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
