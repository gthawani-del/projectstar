<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Project Star — Mumbai Kart Benchmark</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1019;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 18px #000}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:850;color:#bfe4ff}.title{font-size:clamp(28px,7vw,58px);line-height:.9;font-weight:950;margin-top:7px}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:9px 11px;border-radius:999px;background:rgba(2,8,18,.52);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);font-size:12px;font-weight:850}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.hint{max-width:300px;padding:10px 12px;border-radius:15px;background:rgba(2,8,18,.5);border:1px solid rgba(255,255,255,.14);font-size:10.5px;line-height:1.45}.btn{pointer-events:auto;border:0;border-radius:999px;padding:13px 18px;background:#fff;color:#08101b;font-size:14px;font-weight:900}.center{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:8;font-size:clamp(38px,10vw,78px);font-weight:950;opacity:0;transition:.2s;text-align:center;pointer-events:none;text-shadow:0 12px 35px #000}.center.show{opacity:1}#assetStatus{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);z-index:9;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.12);padding:8px 11px;border-radius:12px;font-size:10px}@media(max-width:640px){.title{font-size:31px}.hint{max-width:220px}.pill{padding:8px 9px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud"><div class="top"><div><div class="eyebrow">PROJECT STAR / PREMIUM KART TEST</div><div class="title">MUMBAI<br>MONSOON RACE</div></div><div class="stats"><div class="pill">POS 3/8</div><div class="pill">LAP 2/3</div><div class="pill"><span id="fps">—</span> FPS</div></div></div><div class="bottom"><div class="hint">Drag left/right to steer continuously. This build uses real CC0 racing assets, wet-road PBR, bloom, fog and authored composition rather than primitive-only graphics.</div><button class="btn" id="start">START RACE</button></div></div>
<div id="msg" class="center">READY</div><div id="assetStatus">Loading premium assets…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x162333);scene.fog=new THREE.FogExp2(0x4d6275,.0145);
const camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,.1,420);camera.position.set(0,4.8,10.5);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.48,.62,.84));
scene.add(new THREE.HemisphereLight(0xbfd7ff,0x201810,1.45));const key=new THREE.DirectionalLight(0xffd7a8,2.5);key.position.set(-8,17,9);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.far=80;scene.add(key);const cool=new THREE.DirectionalLight(0x86bfff,1.2);cool.position.set(11,8,-15);scene.add(cool);
const wetRoad=new THREE.MeshPhysicalMaterial({color:0x15181d,metalness:.08,roughness:.18,clearcoat:1,clearcoatRoughness:.12});const concrete=new THREE.MeshStandardMaterial({color:0x575450,roughness:.8});const glass=new THREE.MeshPhysicalMaterial({color:0x22384e,metalness:.2,roughness:.16,transmission:.05});const gold=new THREE.MeshStandardMaterial({color:0xb98731,emissive:0x3a1900,emissiveIntensity:.5,roughness:.35});const neonBlue=new THREE.MeshStandardMaterial({color:0x42bfff,emissive:0x0077ff,emissiveIntensity:3});const neonWarm=new THREE.MeshStandardMaterial({color:0xffa63d,emissive:0xff5c00,emissiveIntensity:2.5});const palmMat=new THREE.MeshStandardMaterial({color:0x123f2b,roughness:.75});
function mesh(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
// Road and wet reflective strips
mesh(new THREE.BoxGeometry(12,.18,460),wetRoad,0,-.08,-210);mesh(new THREE.BoxGeometry(5,.28,460),concrete,-8.5,0,-210);mesh(new THREE.BoxGeometry(5,.28,460),concrete,8.5,0,-210);
for(let z=8;z>-420;z-=8){mesh(new THREE.BoxGeometry(.09,.02,3.7),new THREE.MeshStandardMaterial({color:0xd6e5ef,emissive:0x263a52,emissiveIntensity:.6,roughness:.35}),-2,.03,z);mesh(new THREE.BoxGeometry(.09,.02,3.7),new THREE.MeshStandardMaterial({color:0xd6e5ef,emissive:0x263a52,emissiveIntensity:.6,roughness:.35}),2,.03,z)}
// Landmark silhouette left: CST-inspired massing, intentionally stylized not replica.
const landmark=new THREE.Group();scene.add(landmark);landmark.position.set(-13,0,-86);function addLM(x,y,z,w,h,d,m=gold){const q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;landmark.add(q)}addLM(0,5,0,8,10,6);addLM(-2.8,11,0,2.6,4,2.6);addLM(2.8,11,0,2.6,4,2.6);addLM(0,13.8,0,2.4,7,2.4);const spire=new THREE.Mesh(new THREE.ConeGeometry(.8,5,8),gold);spire.position.set(0,19.5,0);landmark.add(spire);
// Sea-link-inspired bridge to the right.
for(const x of [13,19]){const tower=new THREE.Mesh(new THREE.BoxGeometry(.7,16,.7),concrete);tower.position.set(x,8,-108);scene.add(tower);for(let i=0;i<7;i++){const cable=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,10+i*.8,5),new THREE.MeshStandardMaterial({color:0xcfd9df,roughness:.5}));cable.position.set(x+(x===13?1:-1)*(2.7+i*.45),9-i*.55,-108);cable.rotation.z=(x===13?-1:1)*(.35+i*.02);scene.add(cable)}}
// Palm rows and warm roadside lamps.
const movers=[];for(let i=0;i<38;i++){const z=-8-i*10;for(const side of [-1,1]){const trunk=mesh(new THREE.CylinderGeometry(.11,.18,3.5,7),new THREE.MeshStandardMaterial({color:0x4d321f,roughness:.9}),side*7.1,1.8,z);const crown=mesh(new THREE.SphereGeometry(1.2,8,6),palmMat,side*7.1,3.8,z);crown.scale.set(1.6,.45,1.1);const lamp=mesh(new THREE.CylinderGeometry(.045,.06,2.8,7),concrete,side*6.25,1.4,z+2);const bulb=mesh(new THREE.SphereGeometry(.12,8,6),side<0?neonBlue:neonWarm,side*6.25,2.85,z+2);movers.push(trunk,crown,lamp,bulb)}}
// Dense but cheap city depth using instanced towers.
const towerGeo=new THREE.BoxGeometry(1,1,1);for(const side of [-1,1]){const count=46,mat=side<0?glass:new THREE.MeshStandardMaterial({color:0x252934,roughness:.38});const inst=new THREE.InstancedMesh(towerGeo,mat,count);const d=new THREE.Object3D();for(let i=0;i<count;i++){const h=7+(i*7)%20;d.position.set(side*(10+(i%4)*2.2),h/2,-12-i*8.5);d.scale.set(2.8+(i%3)*.7,h,4.2);d.updateMatrix();inst.setMatrixAt(i,d.matrix)}inst.castShadow=true;inst.receiveShadow=true;scene.add(inst)}
// Mumbai-style overhead sign gantry.
const signMat=new THREE.MeshStandardMaterial({color:0x0b563a,roughness:.55});mesh(new THREE.BoxGeometry(13,.25,.25),concrete,0,5.2,-48);mesh(new THREE.BoxGeometry(.28,5,.28),concrete,-6.1,2.6,-48);mesh(new THREE.BoxGeometry(.28,5,.28),concrete,6.1,2.6,-48);for(const x of [-3.8,0,3.8])mesh(new THREE.BoxGeometry(3.4,1.55,.18),signMat,x,4.45,-47.8);
// Player kart group. Real Kenney CC0 model is loaded into this container.
const kartRoot=new THREE.Group();kartRoot.position.set(0,.18,3.1);scene.add(kartRoot);const kartFallback=new THREE.Group();kartRoot.add(kartFallback);const body=new THREE.Mesh(new THREE.BoxGeometry(2.25,.5,3.4),new THREE.MeshPhysicalMaterial({color:0xa91e32,metalness:.35,roughness:.28,clearcoat:1}));body.position.y=.58;kartFallback.add(body);for(const x of [-1.18,1.18])for(const z of [-1.08,1.08]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.34,16),new THREE.MeshStandardMaterial({color:0x070707,roughness:.8}));w.rotation.z=Math.PI/2;w.position.set(x,.45,z);kartFallback.add(w)}const seat=new THREE.Mesh(new THREE.BoxGeometry(1.05,.8,1.05),new THREE.MeshStandardMaterial({color:0x131313,roughness:.6}));seat.position.set(0,1,-.1);kartFallback.add(seat);
const gltf=new GLTFLoader();const status=document.getElementById('assetStatus');let assetCount=0;function doneAsset(){assetCount++;if(assetCount>=3){status.textContent='CC0 asset set loaded';setTimeout(()=>status.style.display='none',1300)}}
gltf.load('https://raw.githubusercontent.com/KenneyNL/Starter-Kit-Racing/main/models/vehicle-truck-yellow.glb',g=>{const car=g.scene;car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});const b=new THREE.Box3().setFromObject(car),s=new THREE.Vector3();b.getSize(s);const k=1.65/Math.max(s.y,.01);car.scale.setScalar(k);b.setFromObject(car);car.position.y-=b.min.y;car.rotation.y=Math.PI;kartRoot.remove(kartFallback);kartRoot.add(car);doneAsset()},undefined,()=>doneAsset());
const external=[];function loadProp(url,targetH,cb){gltf.load(url,g=>{const o=g.scene;const box=new THREE.Box3().setFromObject(o),s=new THREE.Vector3();box.getSize(s);o.scale.setScalar(targetH/Math.max(s.y,.01));new THREE.Box3().setFromObject(o);o.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});cb(o);doneAsset()},undefined,()=>doneAsset())}
loadProp('https://raw.githubusercontent.com/ictuillinois/Harvest-Kart/main/public/models/racing/barrier.glb',.9,o=>{for(let i=0;i<22;i++){const a=o.clone(true);a.position.set(-5.9,.05,-10-i*11);scene.add(a);const b=a.clone(true);b.position.x=5.9;b.rotation.y=Math.PI;scene.add(b);external.push(a,b)}});loadProp('https://raw.githubusercontent.com/ictuillinois/Harvest-Kart/main/public/models/beach/palm.glb',5.7,o=>{for(let i=0;i<14;i++){const a=o.clone(true);a.position.set(-8.2,0,-18-i*19);scene.add(a);const b=a.clone(true);b.position.x=8.2;b.rotation.y=Math.PI;scene.add(b);external.push(a,b)}});
// Competitor karts, stylized but materially richer.
const rivals=[];for(let i=0;i<5;i++){const g=new THREE.Group();const c=new THREE.Mesh(new THREE.BoxGeometry(1.7,.45,2.65),new THREE.MeshPhysicalMaterial({color:[0xe4a32c,0x2b8d75,0x7e45c7,0xd43774,0x3476d4][i],metalness:.28,roughness:.3,clearcoat:1}));c.position.y=.48;g.add(c);for(const x of [-.92,.92])for(const z of [-.85,.85]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.26,12),new THREE.MeshStandardMaterial({color:0x070707,roughness:.8}));w.rotation.z=Math.PI/2;w.position.set(x,.35,z);g.add(w)}g.position.set([-3.3,2.4,-1.5,3.2,.6][i],.1,-14-i*8);scene.add(g);rivals.push(g)}
// Raindrop particles, cheap GPU points.
const rainGeo=new THREE.BufferGeometry(),rainN=900,arr=new Float32Array(rainN*3);for(let i=0;i<rainN;i++){arr[i*3]=(Math.random()-.5)*34;arr[i*3+1]=Math.random()*18;arr[i*3+2]=-Math.random()*100+10}rainGeo.setAttribute('position',new THREE.BufferAttribute(arr,3));const rain=new THREE.Points(rainGeo,new THREE.PointsMaterial({color:0xc9dcff,size:.035,transparent:true,opacity:.45}));scene.add(rain);
let running=false,speed=22,elapsed=0,steerTarget=0,steer=0,steerVel=0,dragging=false,lastX=0;const start=document.getElementById('start'),msg=document.getElementById('msg');start.onclick=()=>{running=true;elapsed=0;start.textContent='RESTART';msg.textContent='GO!';msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),500)};
function setSteerFromX(x){steerTarget=THREE.MathUtils.clamp((x/innerWidth-.5)*2,-1,1)}renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;renderer.domElement.setPointerCapture?.(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;lastX=e.clientX;steerTarget=THREE.MathUtils.clamp(steerTarget+dx/150,-1,1)});renderer.domElement.addEventListener('pointerup',()=>{dragging=false;steerTarget*=.35});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')steerTarget=-1;if(e.key==='ArrowRight'||e.key==='d')steerTarget=1});addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))steerTarget=0});
const clock=new THREE.Clock();let frames=0,ft=0;function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);frames++;ft+=dt;if(ft>.5){document.getElementById('fps').textContent=Math.round(frames/ft);frames=0;ft=0}if(running){elapsed+=dt;speed=Math.min(31,22+elapsed*.12);const k=30,d=10;const accel=(steerTarget-steer)*k-steerVel*d;steerVel+=accel*dt;steer+=steerVel*dt;kartRoot.position.x=steer*3.9;kartRoot.rotation.z=-steerVel*.032;kartRoot.rotation.y=steer*.055;camera.position.x=THREE.MathUtils.lerp(camera.position.x,kartRoot.position.x*.28,1-Math.exp(-3.8*dt));camera.position.y=4.8+Math.sin(elapsed*7)*.015;camera.lookAt(kartRoot.position.x*.08,1.2,-16);for(const o of [...movers,...external,...rivals]){o.position.z+=speed*dt;if(o.position.z>15)o.position.z-=250}const p=rain.geometry.attributes.position.array;for(let i=0;i<rainN;i++){p[i*3+1]-=dt*13;if(p[i*3+1]<0)p[i*3+1]=18}rain.geometry.attributes.position.needsUpdate=true}composer.render()}
animate();msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),900);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
