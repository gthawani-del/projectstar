<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Project Star — Three.js Premium Runner Benchmark</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 18px #000}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:#9fdcff}.title{font-size:clamp(30px,7vw,58px);line-height:.9;font-weight:950;margin-top:7px}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:9px 12px;border-radius:999px;background:rgba(0,7,20,.48);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);font-size:12px;font-weight:850}.bottom{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.hint{max-width:320px;padding:11px 13px;border-radius:16px;background:rgba(0,7,20,.5);border:1px solid rgba(255,255,255,.14);font-size:11px;line-height:1.45}.btn{pointer-events:auto;border:0;border-radius:999px;padding:14px 20px;background:#fff;color:#050814;font-size:14px;font-weight:900}.center{position:fixed;left:50%;top:49%;transform:translate(-50%,-50%);z-index:7;font-size:clamp(44px,12vw,88px);font-weight:950;letter-spacing:-.04em;opacity:0;transition:.2s;pointer-events:none;text-shadow:0 10px 35px #000}.center.show{opacity:1}#status{position:fixed;left:50%;bottom:26%;transform:translateX(-50%);z-index:8;padding:9px 12px;border-radius:12px;background:rgba(0,0,0,.55);font-size:11px;display:none}@media(max-width:640px){#hud{padding-left:14px;padding-right:14px}.title{font-size:31px}.pill{padding:8px 9px}.hint{max-width:220px;font-size:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud"><div class="top"><div><div class="eyebrow">PROJECT STAR / THREE.JS BENCHMARK</div><div class="title">NEON<br>RUNNER</div></div><div class="stats"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">COINS <span id="coins">0</span></div><div class="pill"><span id="fps">—</span> FPS</div></div></div><div class="bottom"><div class="hint">Swipe left/right for lanes. Swipe up to jump. This benchmark uses a real glTF avatar, post-processing and eased lane movement.</div><button class="btn" id="start">START RUN</button></div></div>
<div id="msg" class="center">READY</div><div id="status"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// Visual benchmark inspired by the MIT-licensed markstent/runner project.
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x01040b);scene.fog=new THREE.FogExp2(0x07101b,.022);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,280);camera.position.set(0,4.2,8.5);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.65,.7,.78);composer.addPass(bloom);
scene.add(new THREE.HemisphereLight(0x7ba7ff,0x09101c,1.65));const key=new THREE.DirectionalLight(0x9fc2ff,2.2);key.position.set(-8,14,9);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const rim=new THREE.DirectionalLight(0xff257f,1.4);rim.position.set(10,7,-12);scene.add(rim);
const mat=(color,emissive=0,metal=.1,rough=.45)=>new THREE.MeshStandardMaterial({color,emissive,emissiveIntensity:emissive?2.2:0,metalness:metal,roughness:rough});
const asphalt=mat(0x11141b,0,0,.88), curb=mat(0x262b39), glass=mat(0x08182c,0x07244f,.72,.18), cyan=mat(0x0877a8,0x00bfff,.25,.22), pink=mat(0x7d164e,0xff1788,.2,.25), amber=mat(0x6d3a05,0xff8a00,.1,.4), concrete=mat(0x2a2c34), coinMat=mat(0x9c5c05,0xffb300,.78,.15);
function mesh(g,m,x,y,z){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
const road=mesh(new THREE.BoxGeometry(10,.18,320),asphalt,0,-.1,-145),left=mesh(new THREE.BoxGeometry(5,.3,320),concrete,-7.5,0,-145),right=mesh(new THREE.BoxGeometry(5,.3,320),mat(0x32221b),7.5,0,-145);
for(let z=5;z>-290;z-=7){mesh(new THREE.BoxGeometry(.08,.02,3.2),mat(0xcfe8ff,0x6aa8ff),-1.65,.03,z);mesh(new THREE.BoxGeometry(.08,.02,3.2),mat(0xcfe8ff,0x6aa8ff),1.65,.03,z)}
const movers=[];
function building(side,z,i){const x=side*(8.8+(i%4)*1.8),h=7+(i*13)%21,w=2.6+(i%3)*.55,d=4.2;const base=mesh(new THREE.BoxGeometry(w,h,d),i%3===0?glass:mat(0x101523),x,h/2,z);movers.push(base);for(let y=2;y<h-1;y+=2.5){const strips=mesh(new THREE.BoxGeometry(.05,.11,d*.72),i%2?pink:cyan,x-side*(w/2+.035),y,z);movers.push(strips)}if(i%4===0){const crown=mesh(new THREE.CylinderGeometry(w*.28,w*.5,1.8,8),amber,x,h+.9,z);movers.push(crown)}return base}
for(let i=0;i<34;i++){building(-1,-8-i*7.5,i);building(1,-11-i*7.5,i+2)}
for(let i=0;i<36;i++){const z=-3-i*8;const p=mesh(new THREE.CylinderGeometry(.05,.07,2.8,8),concrete,-5.6,1.4,z);const q=mesh(new THREE.SphereGeometry(.13,10,8),i%2?pink:cyan,-5.6,2.85,z);const p2=p.clone(),q2=q.clone();p2.position.x=5.6;q2.position.x=5.6;scene.add(p2,q2);movers.push(p,q,p2,q2)}
const moon=mesh(new THREE.SphereGeometry(2,24,16),mat(0x8399c7,0x1a2a50,.05,.65),12,20,-85);movers.push(moon);
const lanes=[-3.05,0,3.05];let lane=1,targetX=0,laneFrom=0,laneT=1,laneDur=.22,jumpY=0,jumpV=0,running=false,speed=18,score=0,coins=0,elapsed=0,spawnTimer=.7,coinTimer=1.8;
const player=new THREE.Group();player.position.set(0,0,2);scene.add(player);
let avatar=null,mixer=null,runAction=null;const fallback=mesh(new THREE.CapsuleGeometry(.45,1.15,6,10),mat(0x143a7b),0,1.15,2);scene.remove(fallback);player.add(fallback);fallback.position.set(0,1.15,0);
const status=document.getElementById('status');
new GLTFLoader().load('https://raw.githubusercontent.com/markstent/runner/master/public/avatar.glb',g=>{avatar=g.scene;avatar.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});avatar.scale.setScalar(1.05);avatar.rotation.y=Math.PI;avatar.position.y=0;player.remove(fallback);player.add(avatar);if(g.animations.length){mixer=new THREE.AnimationMixer(avatar);runAction=mixer.clipAction(g.animations[0]);runAction.play()}},undefined,e=>{status.style.display='block';status.textContent='Avatar fallback active';setTimeout(()=>status.style.display='none',1800)});
const obstacles=[],coinObjs=[];function obstacle(){const x=lanes[Math.floor(Math.random()*3)],g=new THREE.BoxGeometry(1.55,1.2,.9),o=mesh(g,Math.random()>.5?cyan:pink,x,.62,-82);obstacles.push(o)}function coinRow(){const x=lanes[Math.floor(Math.random()*3)];for(let i=0;i<6;i++){const c=mesh(new THREE.TorusGeometry(.25,.08,10,20),coinMat,x,1.15,-55-i*2.6);c.rotation.y=Math.PI/2;coinObjs.push(c)}}
function laneMove(d){if(!running)return;const next=Math.max(0,Math.min(2,lane+d));if(next===lane)return;lane=next;laneFrom=player.position.x;targetX=lanes[lane];laneT=0}function jump(){if(!running||jumpY>0.01)return;jumpV=7.4}
function startRun(){obstacles.splice(0).forEach(o=>scene.remove(o));coinObjs.splice(0).forEach(o=>scene.remove(o));lane=1;targetX=0;player.position.x=0;laneFrom=0;laneT=1;jumpY=jumpV=0;score=coins=elapsed=0;speed=18;running=true;document.getElementById('score').textContent='0';document.getElementById('coins').textContent='0';document.getElementById('start').textContent='RESTART';const m=document.getElementById('msg');m.textContent='GO!';m.classList.add('show');setTimeout(()=>m.classList.remove('show'),500)}document.getElementById('start').addEventListener('click',startRun);
let sx=0,sy=0;renderer.domElement.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});renderer.domElement.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>38&&Math.abs(dx)>Math.abs(dy))laneMove(dx>0?1:-1);else if(dy<-42)jump()},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')laneMove(-1);if(e.key==='ArrowRight'||e.key==='d')laneMove(1);if(e.key==='ArrowUp'||e.code==='Space')jump()});
const clock=new THREE.Clock();let frames=0,fpst=0;function easeInOutCubic(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);frames++;fpst+=dt;if(fpst>.5){document.getElementById('fps').textContent=Math.round(frames/fpst);frames=0;fpst=0}if(mixer)mixer.update(dt*(running?1.25:1));if(running){elapsed+=dt;speed=Math.min(30,18+elapsed*.28);score+=dt*speed*2.5;document.getElementById('score').textContent=Math.floor(score);if(laneT<1){laneT=Math.min(1,laneT+dt/laneDur);player.position.x=THREE.MathUtils.lerp(laneFrom,targetX,easeInOutCubic(laneT))}jumpV-=18*dt;jumpY=Math.max(0,jumpY+jumpV*dt);if(jumpY===0&&jumpV<0)jumpV=0;player.position.y=jumpY;const lean=laneT<1?(targetX-laneFrom)*Math.sin(Math.PI*laneT)*-.09:0;player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,lean,Math.min(1,dt*12));camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.22,Math.min(1,dt*5));camera.lookAt(player.position.x*.08,1.2,-15);movers.forEach(o=>{o.position.z+=speed*dt;if(o!==moon&&o.position.z>14)o.position.z-=255});spawnTimer-=dt;coinTimer-=dt;if(spawnTimer<=0){obstacle();spawnTimer=.9+Math.random()*.65}if(coinTimer<=0){coinRow();coinTimer=2.2+Math.random()*1.1}for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.position.z+=speed*dt;if(o.position.z>8){scene.remove(o);obstacles.splice(i,1);continue}if(Math.abs(o.position.z-2)<.85&&Math.abs(o.position.x-player.position.x)<1.05&&jumpY<1.15){running=false;const m=document.getElementById('msg');m.textContent='CRASH';m.classList.add('show');document.getElementById('start').textContent='RUN AGAIN'}}for(let i=coinObjs.length-1;i>=0;i--){const c=coinObjs[i];c.position.z+=speed*dt;c.rotation.x+=dt*3.2;if(c.position.z>8){scene.remove(c);coinObjs.splice(i,1);continue}if(Math.abs(c.position.z-2)<.8&&Math.abs(c.position.x-player.position.x)<.85&&Math.abs(c.position.y-(1.15+jumpY))<1.2){coins++;score+=35;document.getElementById('coins').textContent=coins;scene.remove(c);coinObjs.splice(i,1)}}}composer.render()}
animate();const m=document.getElementById('msg');m.classList.add('show');setTimeout(()=>m.classList.remove('show'),800);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
