<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Project Star — Three.js Premium Runner Benchmark</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050d;font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;z-index:5;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 18px #000}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:800;color:#9fdcff}.title{font-size:clamp(30px,7vw,58px);line-height:.9;font-weight:950;margin-top:7px}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:9px 12px;border-radius:999px;background:rgba(0,7,20,.48);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);font-size:12px;font-weight:850}.bottom{display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.hint{max-width:320px;padding:11px 13px;border-radius:16px;background:rgba(0,7,20,.5);border:1px solid rgba(255,255,255,.14);font-size:11px;line-height:1.45}.btn{pointer-events:auto;border:0;border-radius:999px;padding:14px 20px;background:#fff;color:#050814;font-size:14px;font-weight:900}.center{position:fixed;left:50%;top:49%;transform:translate(-50%,-50%);z-index:7;font-size:clamp(44px,12vw,88px);font-weight:950;letter-spacing:-.04em;opacity:0;transition:.2s;pointer-events:none;text-shadow:0 10px 35px #000}.center.show{opacity:1}@media(max-width:640px){#hud{padding-left:14px;padding-right:14px}.title{font-size:31px}.pill{padding:8px 9px}.hint{max-width:220px;font-size:10px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud"><div class="top"><div><div class="eyebrow">PROJECT STAR / CONTROL TEST V2</div><div class="title">NEON<br>RUNNER</div></div><div class="stats"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">COINS <span id="coins">0</span></div><div class="pill"><span id="fps">—</span> FPS</div></div></div><div class="bottom"><div class="hint">Swipe left/right for lanes. Swipe up to jump. V2 uses spring-based lane movement, softer camera follow and a purpose-built runner character.</div><button class="btn" id="start">START RUN</button></div></div>
<div id="msg" class="center">READY</div>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.06;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x01040b);scene.fog=new THREE.FogExp2(0x07101b,.021);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,280);camera.position.set(0,4.0,8.7);
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.58,.68,.8));
scene.add(new THREE.HemisphereLight(0x7ba7ff,0x09101c,1.75));const key=new THREE.DirectionalLight(0xa7c7ff,2.3);key.position.set(-8,14,9);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);const rim=new THREE.DirectionalLight(0xff2d8c,1.5);rim.position.set(10,7,-12);scene.add(rim);
const mat=(color,emissive=0,metal=.1,rough=.45)=>new THREE.MeshStandardMaterial({color,emissive,emissiveIntensity:emissive?2.15:0,metalness:metal,roughness:rough});
const asphalt=mat(0x0f1218,0,0,.92),concrete=mat(0x242a34),glass=mat(0x07172a,0x082a54,.72,.18),cyan=mat(0x0877a8,0x00bfff,.25,.22),pink=mat(0x7d164e,0xff1788,.2,.25),amber=mat(0x6d3a05,0xff8a00,.1,.4),coinMat=mat(0x9c5c05,0xffb300,.78,.15);
function mesh(g,m,x,y,z,parent=scene){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
mesh(new THREE.BoxGeometry(10,.18,320),asphalt,0,-.1,-145);mesh(new THREE.BoxGeometry(5,.3,320),concrete,-7.5,0,-145);mesh(new THREE.BoxGeometry(5,.3,320),mat(0x32221b),7.5,0,-145);
for(let z=5;z>-290;z-=7){mesh(new THREE.BoxGeometry(.08,.02,3.2),mat(0xcfe8ff,0x6aa8ff),-1.65,.03,z);mesh(new THREE.BoxGeometry(.08,.02,3.2),mat(0xcfe8ff,0x6aa8ff),1.65,.03,z)}
const movers=[];function building(side,z,i){const x=side*(8.8+(i%4)*1.8),h=7+(i*13)%21,w=2.6+(i%3)*.55,d=4.2;const base=mesh(new THREE.BoxGeometry(w,h,d),i%3===0?glass:mat(0x101523),x,h/2,z);movers.push(base);for(let y=2;y<h-1;y+=2.5){const strips=mesh(new THREE.BoxGeometry(.05,.11,d*.72),i%2?pink:cyan,x-side*(w/2+.035),y,z);movers.push(strips)}if(i%4===0){const crown=mesh(new THREE.CylinderGeometry(w*.28,w*.5,1.8,8),amber,x,h+.9,z);movers.push(crown)}}
for(let i=0;i<34;i++){building(-1,-8-i*7.5,i);building(1,-11-i*7.5,i+2)}
for(let i=0;i<36;i++){const z=-3-i*8;const p=mesh(new THREE.CylinderGeometry(.05,.07,2.8,8),concrete,-5.6,1.4,z),q=mesh(new THREE.SphereGeometry(.13,10,8),i%2?pink:cyan,-5.6,2.85,z);const p2=p.clone(),q2=q.clone();p2.position.x=5.6;q2.position.x=5.6;scene.add(p2,q2);movers.push(p,q,p2,q2)}

// Purpose-built stylized runner: clean silhouette, athletic proportions, no tangled imported rig.
const player=new THREE.Group();player.position.set(0,0,2);scene.add(player);
const skin=mat(0x8f5539,0,0,.72),suit=mat(0x0d2f74,0x071a45,.35,.26),trim=mat(0x00a2ff,0x006dff,.5,.2),shoe=mat(0xe8efff,0x2f63ff,.18,.3),hair=mat(0x17130f),visor=mat(0x121c2e,0x00aaff,.75,.08);
const torso=mesh(new THREE.CapsuleGeometry(.44,1.12,8,16),suit,0,1.45,0,player);torso.scale.set(1.0,1.0,.72);
const waist=mesh(new THREE.CapsuleGeometry(.34,.34,6,14),suit,0,.78,0,player);waist.scale.z=.72;
const head=mesh(new THREE.SphereGeometry(.34,20,14),skin,0,2.42,0,player);head.scale.set(1,.98,.92);
const hairCap=mesh(new THREE.SphereGeometry(.35,18,10,0,Math.PI*2,0,Math.PI*.55),hair,0,2.52,-.01,player);
const visorStrip=mesh(new THREE.BoxGeometry(.48,.08,.08),visor,0,2.43,-.31,player);
const chestStrip=mesh(new THREE.BoxGeometry(.12,.72,.05),trim,0,1.55,-.34,player);
const leftArm=new THREE.Group(),rightArm=new THREE.Group(),leftLeg=new THREE.Group(),rightLeg=new THREE.Group();player.add(leftArm,rightArm,leftLeg,rightLeg);
leftArm.position.set(-.53,1.78,0);rightArm.position.set(.53,1.78,0);leftLeg.position.set(-.22,.78,0);rightLeg.position.set(.22,.78,0);
function limb(group,upperLen,lowerLen,material,shoeEnd=false){const upper=mesh(new THREE.CapsuleGeometry(.11,upperLen,6,10),material,0,-upperLen*.45,0,group);const joint=new THREE.Group();joint.position.y=-upperLen*.95;group.add(joint);const lower=mesh(new THREE.CapsuleGeometry(.10,lowerLen,6,10),material,0,-lowerLen*.45,0,joint);if(shoeEnd)mesh(new THREE.BoxGeometry(.26,.18,.48),shoe,0,-lowerLen*.95,-.12,joint);return {upper,joint,lower}}
const LA=limb(leftArm,.62,.55,skin),RA=limb(rightArm,.62,.55,skin),LL=limb(leftLeg,.78,.72,suit,true),RL=limb(rightLeg,.78,.72,suit,true);

const lanes=[-3.05,0,3.05];let lane=1,targetX=0,xVel=0,jumpY=0,jumpV=0,running=false,speed=16.5,score=0,coins=0,elapsed=0,spawnTimer=1.3,coinTimer=2.0,camXVel=0;
const obstacles=[],coinObjs=[];function obstacle(){const x=lanes[Math.floor(Math.random()*3)],o=mesh(new THREE.BoxGeometry(1.45,1.05,.85),Math.random()>.5?cyan:pink,x,.55,-86);obstacles.push(o)}function coinRow(){const x=lanes[Math.floor(Math.random()*3)];for(let i=0;i<6;i++){const c=mesh(new THREE.TorusGeometry(.25,.08,10,20),coinMat,x,1.15,-58-i*2.8);c.rotation.y=Math.PI/2;coinObjs.push(c)}}
function laneMove(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));targetX=lanes[lane]}function jump(){if(!running||jumpY>.03)return;jumpV=7.1}
function startRun(){obstacles.splice(0).forEach(o=>scene.remove(o));coinObjs.splice(0).forEach(o=>scene.remove(o));lane=1;targetX=0;player.position.x=0;xVel=0;jumpY=jumpV=0;score=coins=elapsed=0;speed=16.5;spawnTimer=1.35;coinTimer=1.8;running=true;scoreEl.textContent='0';coinsEl.textContent='0';startBtn.textContent='RESTART';msg.textContent='GO!';msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),500)}
const scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),fpsEl=document.getElementById('fps'),startBtn=document.getElementById('start'),msg=document.getElementById('msg');startBtn.addEventListener('click',startRun);
let sx=0,sy=0;renderer.domElement.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});renderer.domElement.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>34&&Math.abs(dx)>Math.abs(dy))laneMove(dx>0?1:-1);else if(dy<-38)jump()},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')laneMove(-1);if(e.key==='ArrowRight'||e.key==='d')laneMove(1);if(e.key==='ArrowUp'||e.code==='Space')jump()});

const clock=new THREE.Clock();let frames=0,fpst=0;function spring(current,target,velocity,dt,stiff=115,damp=20){const acc=(target-current)*stiff-velocity*damp;velocity+=acc*dt;current+=velocity*dt;return [current,velocity]}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);frames++;fpst+=dt;if(fpst>.5){fpsEl.textContent=Math.round(frames/fpst);frames=0;fpst=0}if(running){elapsed+=dt;speed=Math.min(25.5,16.5+elapsed*.12);score+=dt*speed*2.3;scoreEl.textContent=Math.floor(score);
[player.position.x,xVel]=spring(player.position.x,targetX,xVel,dt,105,19);jumpV-=17.2*dt;jumpY=Math.max(0,jumpY+jumpV*dt);if(jumpY===0&&jumpV<0)jumpV=0;player.position.y=jumpY;
const laneDelta=targetX-player.position.x,lean=THREE.MathUtils.clamp(-xVel*.045,-.18,.18);player.rotation.z+= (lean-player.rotation.z)*Math.min(1,dt*10);
const cadence=elapsed*speed*.62,s=Math.sin(cadence),c=Math.cos(cadence);leftArm.rotation.x=s*.72;rightArm.rotation.x=-s*.72;leftLeg.rotation.x=-s*.62;rightLeg.rotation.x=s*.62;LA.joint.rotation.x=-Math.max(0,-s)*.65;RA.joint.rotation.x=-Math.max(0,s)*.65;LL.joint.rotation.x=Math.max(0,s)*.55;RL.joint.rotation.x=Math.max(0,-s)*.55;torso.rotation.x=.05+Math.abs(s)*.025;head.position.y=2.42+Math.abs(s)*.025;
const camTarget=player.position.x*.16;[camera.position.x,camXVel]=spring(camera.position.x,camTarget,camXVel,dt,42,12);camera.position.y=4.0+Math.abs(s)*.025;camera.lookAt(player.position.x*.055,1.25,-15);
movers.forEach(o=>{o.position.z+=speed*dt;if(o.position.z>14)o.position.z-=255});spawnTimer-=dt;coinTimer-=dt;if(spawnTimer<=0){obstacle();spawnTimer=1.38+Math.random()*.62}if(coinTimer<=0){coinRow();coinTimer=2.5+Math.random()*1.2}
for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.position.z+=speed*dt;if(o.position.z>8){scene.remove(o);obstacles.splice(i,1);continue}if(Math.abs(o.position.z-2)<.82&&Math.abs(o.position.x-player.position.x)<.95&&jumpY<1.08){running=false;msg.textContent='CRASH';msg.classList.add('show');startBtn.textContent='RUN AGAIN'}}
for(let i=coinObjs.length-1;i>=0;i--){const cobj=coinObjs[i];cobj.position.z+=speed*dt;cobj.rotation.x+=dt*3.2;if(cobj.position.z>8){scene.remove(cobj);coinObjs.splice(i,1);continue}if(Math.abs(cobj.position.z-2)<.8&&Math.abs(cobj.position.x-player.position.x)<.8&&Math.abs(cobj.position.y-(1.15+jumpY))<1.15){coins++;score+=35;coinsEl.textContent=coins;scene.remove(cobj);coinObjs.splice(i,1)}}}
composer.render()}
animate();msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),800);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
