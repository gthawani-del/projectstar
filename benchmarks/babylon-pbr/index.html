<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Project Star B — Babylon PBR</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:Inter,system-ui}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;padding:16px}.top{display:flex;justify-content:space-between}.badge,.fps{background:#0008;border:1px solid #ffffff22;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800;backdrop-filter:blur(10px)}.back{pointer-events:auto;position:fixed;top:62px;left:16px;color:#fff;text-decoration:none;background:#0008;padding:8px 10px;border-radius:999px}.bottom{position:absolute;left:16px;right:16px;bottom:20px;display:flex;justify-content:space-between;align-items:end}.hint{font-size:11px;background:#0008;padding:9px 11px;border-radius:12px;max-width:220px}.speed{font-size:48px;font-weight:900;line-height:.8}.speed small{display:block;font-size:10px;letter-spacing:.14em;margin-top:10px}</style><script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><div class="badge">B / BABYLON.JS PBR</div><div class="fps"><span id="fps">—</span> FPS</div></div><a class="back" href="/benchmarks/">← Benchmarks</a><div class="bottom"><div class="hint">Drag left/right. Same target: detailed car, cinematic chase camera and mobile stability.</div><div class="speed">118<small>KM/H</small></div></div></div><script>const canvas=document.getElementById('c'),engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,adaptToDeviceRatio:true});const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.035,.06,.1,1);scene.fogMode=BABYLON.Scene.FOGMODE_LINEAR;scene.fogColor=new BABYLON.Color3(.15,.22,.31);scene.fogStart=28;scene.fogEnd=120;scene.environmentTexture=BABYLON.CubeTexture.CreateFromPrefilteredData('https://assets.babylonjs.com/environments/environmentSpecular.env',scene);const cam=new BABYLON.FreeCamera('cam',new BABYLON.Vector3(0,2.25,6.2),scene);cam.fov=.9;const hemi=new BABYLON.HemisphericLight('h',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=1.2;const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(.3,-1,-.3),scene);sun.position=new BABYLON.Vector3(-7,14,8);sun.intensity=2.5;const road=BABYLON.MeshBuilder.CreateGround('road',{width:16,height:220},scene);road.position.z=-95;const rm=new BABYLON.PBRMetallicRoughnessMaterial('roadMat',scene);rm.baseColor=new BABYLON.Color3(.08,.1,.13);rm.metallic=.2;rm.roughness=.2;road.material=rm;const wm=new BABYLON.StandardMaterial('line',scene);wm.diffuseColor=new BABYLON.Color3(.95,.97,1);wm.emissiveColor=new BABYLON.Color3(.1,.15,.25);const marks=[];for(let z=8;z>-180;z-=8)for(const x of[-2.2,2.2]){const m=BABYLON.MeshBuilder.CreateBox('m',{width:.11,height:.025,depth:3.8},scene);m.position=new BABYLON.Vector3(x,.02,z);m.material=wm;marks.push(m)}const poleMat=new BABYLON.StandardMaterial('pole',scene);poleMat.diffuseColor=new BABYLON.Color3(.15,.18,.22);const bulbMat=new BABYLON.StandardMaterial('bulb',scene);bulbMat.emissiveColor=new BABYLON.Color3(1,.35,.05);const poles=[];for(let i=0;i<28;i++)for(const side of[-1,1]){const root=new BABYLON.TransformNode('p',scene);const p=BABYLON.MeshBuilder.CreateCylinder('pole',{height:3.8,diameter:.08},scene);p.parent=root;p.position.y=1.9;p.material=poleMat;const b=BABYLON.MeshBuilder.CreateSphere('b',{diameter:.18},scene);b.parent=root;b.position.y=3.8;b.material=bulbMat;root.position=new BABYLON.Vector3(side*6.2,0,-5-i*7);poles.push(root)}const carRoot=new BABYLON.TransformNode('carRoot',scene);carRoot.position=new BABYLON.Vector3(0,.05,2.5);BABYLON.SceneLoader.ImportMeshAsync('', 'https://threejs.org/examples/models/gltf/','ferrari.glb',scene).then(res=>{const root=new BABYLON.TransformNode('ferrariRoot',scene);for(const m of res.meshes){if(m!==scene.meshes[0])m.parent=root}root.parent=carRoot;root.rotation.y=Math.PI;root.scaling=new BABYLON.Vector3(2.2,2.2,2.2)}).catch(()=>{const f=BABYLON.MeshBuilder.CreateBox('fallback',{width:2,height:.55,depth:4},scene);f.parent=carRoot;f.position.y=.5;const mat=new BABYLON.PBRMaterial('paint',scene);mat.albedoColor=new BABYLON.Color3(.55,.03,.06);mat.metallic=.6;mat.roughness=.16;f.material=mat});let dragging=false,last=0,target=0,steer=0;canvas.addEventListener('pointerdown',e=>{dragging=true;last=e.clientX});canvas.addEventListener('pointermove',e=>{if(!dragging)return;target=Math.max(-3.8,Math.min(3.8,target+(e.clientX-last)/innerWidth*8));last=e.clientX});addEventListener('pointerup',()=>dragging=false);let lastT=performance.now(),fc=0,ft=performance.now();engine.runRenderLoop(()=>{const now=performance.now(),dt=Math.min(.033,(now-lastT)/1000);lastT=now;steer+=(target-steer)*(1-Math.exp(-7*dt));carRoot.position.x=steer;carRoot.rotation.z=-(target-steer)*.05;for(const m of marks){m.position.z+=dt*28;if(m.position.z>10)m.position.z-=192}for(const p of poles){p.position.z+=dt*28;if(p.position.z>12)p.position.z-=196}cam.position.x+=(steer*.28-cam.position.x)*(1-Math.exp(-4*dt));cam.setTarget(new BABYLON.Vector3(steer*.12,.7,-8));scene.render();fc++;if(now-ft>500){document.getElementById('fps').textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}});addEventListener('resize',()=>engine.resize())</script></body></html>
