<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Project Star A — Three.js PBR</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080c;color:#fff;font-family:Inter,system-ui}canvas{display:block;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none;padding:16px}.top{display:flex;justify-content:space-between}.badge,.fps{background:#0008;border:1px solid #ffffff22;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800;backdrop-filter:blur(10px)}.bottom{position:absolute;left:16px;right:16px;bottom:20px;display:flex;justify-content:space-between;align-items:end}.speed{font-size:48px;font-weight:900;line-height:.8}.speed small{display:block;font-size:10px;letter-spacing:.14em;margin-top:10px}.hint{font-size:11px;background:#0008;padding:9px 11px;border-radius:12px;max-width:220px}.back{pointer-events:auto;position:fixed;top:62px;left:16px;color:#fff;text-decoration:none;background:#0008;padding:8px 10px;border-radius:999px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head><body><div class="hud"><div class="top"><div class="badge">A / THREE.JS PBR VEHICLE</div><div class="fps"><span id="fps">—</span> FPS</div></div><a class="back" href="/benchmarks/">← Benchmarks</a><div class="bottom"><div class="hint">Drag left/right. This test uses a detailed Three.js Ferrari GLB rather than low-poly kart geometry.</div><div class="speed"><span id="speed">118</span><small>KM/H</small></div></div></div><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';import{EffectComposer}from'three/addons/postprocessing/EffectComposer.js';import{RenderPass}from'three/addons/postprocessing/RenderPass.js';import{UnrealBloomPass}from'three/addons/postprocessing/UnrealBloomPass.js';const r=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});r.setPixelRatio(Math.min(devicePixelRatio,1.7));r.setSize(innerWidth,innerHeight);r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.1;r.shadowMap.enabled=true;document.body.prepend(r.domElement);const s=new THREE.Scene();s.background=new THREE.Color(0x0c1624);s.fog=new THREE.Fog(0x26384f,26,120);const pm=new THREE.PMREMGenerator(r);s.environment=pm.fromScene(new RoomEnvironment(),.04).texture;const c=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,180);c.position.set(0,2.25,6.4);const comp=new EffectComposer(r);comp.addPass(new RenderPass(s,c));comp.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.28,.35,.9));s.add(new THREE.HemisphereLight(0xdbe8ff,0x271b12,1.1));const sun=new THREE.DirectionalLight(0xffd2a3,3);sun.position.set(-6,12,7);sun.castShadow=true;s.add(sun);const rim=new THREE.DirectionalLight(0x6ca7ff,2.2);rim.position.set(8,5,-12);s.add(rim);const roadMat=new THREE.MeshPhysicalMaterial({color:0x1c2229,metalness:.15,roughness:.2,clearcoat:1,clearcoatRoughness:.06});const road=new THREE.Mesh(new THREE.PlaneGeometry(16,220),roadMat);road.rotation.x=-Math.PI/2;road.position.z=-95;road.receiveShadow=true;s.add(road);const white=new THREE.MeshStandardMaterial({color:0xf5f7fb,emissive:0x172333,emissiveIntensity:.4});const marks=[];for(let z=8;z>-180;z-=8)for(const x of[-2.2,2.2]){const m=new THREE.Mesh(new THREE.PlaneGeometry(.12,3.8),white);m.rotation.x=-Math.PI/2;m.position.set(x,.012,z);s.add(m);marks.push(m)}const lampMat=new THREE.MeshStandardMaterial({color:0xffb25c,emissive:0xff7a00,emissiveIntensity:3});const poles=[];for(let i=0;i<28;i++)for(const side of[-1,1]){const g=new THREE.Group();const p=new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,3.8,8),new THREE.MeshStandardMaterial({color:0x313944,metalness:.4,roughness:.5}));p.position.y=1.9;g.add(p);const b=new THREE.Mesh(new THREE.SphereGeometry(.1,10,8),lampMat);b.position.y=3.8;g.add(b);g.position.set(side*6.2,0,-5-i*7);s.add(g);poles.push(g)}const carRoot=new THREE.Group();carRoot.position.set(0,.06,2.6);s.add(carRoot);const loader=new GLTFLoader();loader.load('https://threejs.org/examples/models/gltf/ferrari.glb',g=>{const car=g.scene;car.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.envMapIntensity=1.5;o.material.needsUpdate=true}}});const b=new THREE.Box3().setFromObject(car),sz=new THREE.Vector3();b.getSize(sz);car.scale.setScalar(2.15/Math.max(sz.y,.01));const nb=new THREE.Box3().setFromObject(car);car.position.y-=nb.min.y;car.rotation.y=Math.PI;carRoot.add(car)},undefined,()=>{const f=new THREE.Mesh(new THREE.BoxGeometry(2,.55,4),new THREE.MeshPhysicalMaterial({color:0xb51225,metalness:.55,roughness:.18,clearcoat:1}));f.position.y=.5;carRoot.add(f)});let steer=0,target=0,drag=false,last=0,t=0,fc=0,ft=performance.now();const fps=document.getElementById('fps');addEventListener('pointerdown',e=>{drag=true;last=e.clientX});addEventListener('pointermove',e=>{if(!drag)return;target=THREE.MathUtils.clamp(target+(e.clientX-last)/innerWidth*8,-3.8,3.8);last=e.clientX});addEventListener('pointerup',()=>drag=false);function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-t)/1000||.016);t=now;steer=THREE.MathUtils.damp(steer,target,7,dt);carRoot.position.x=steer;carRoot.rotation.z=-(target-steer)*.06;for(const m of marks){m.position.z+=dt*28;if(m.position.z>10)m.position.z-=192}for(const p of poles){p.position.z+=dt*28;if(p.position.z>12)p.position.z-=196}c.position.x=THREE.MathUtils.damp(c.position.x,steer*.28,4,dt);c.lookAt(steer*.12,.7,-8);comp.render();fc++;if(now-ft>500){fps.textContent=Math.round(fc*1000/(now-ft));fc=0;ft=now}}requestAnimationFrame(loop);addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);comp.setSize(innerWidth,innerHeight)})</script></body></html>
