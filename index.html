<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Project Star — Dubai Night Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;font-family:Inter,system-ui,-apple-system,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}#hud{position:fixed;inset:0;z-index:2;pointer-events:none;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 16px rgba(0,0,0,.75)}.top{display:flex;justify-content:space-between;gap:10px}.brand{font-size:11px;font-weight:900;letter-spacing:.16em;color:#c8d7ff}.title{font-size:clamp(30px,7vw,54px);font-weight:950;line-height:.9;margin-top:8px}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:9px 12px;border-radius:999px;background:rgba(3,8,18,.42);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(14px);font-weight:850;font-size:13px}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.help{max-width:390px;padding:11px 13px;border-radius:16px;background:rgba(3,8,18,.42);border:1px solid rgba(255,255,255,.14);font-size:12px;line-height:1.45}.btn{pointer-events:auto;border:0;border-radius:999px;padding:14px 22px;background:#fff;color:#09101f;font-weight:950;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.2)}.center{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:950;font-size:clamp(34px,8vw,72px);color:#fff;text-shadow:0 7px 25px #000;opacity:0;transition:.2s;pointer-events:none}.center.show{opacity:1}#boot{position:fixed;z-index:4;left:50%;top:60%;transform:translateX(-50%);max-width:86vw;padding:10px 14px;border-radius:14px;background:rgba(120,0,0,.9);color:#fff;font-size:12px;display:none;white-space:pre-wrap}@media(max-width:640px){#hud{padding:14px}.title{font-size:31px}.help{max-width:225px;font-size:10.5px}.pill{padding:8px 9px;font-size:12px}.btn{padding:13px 18px}}
</style>
<script src="https://code.playcanvas.com/playcanvas-stable.min.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="top"><div><div class="brand">PROJECT STAR / VISUAL UPGRADE V1</div><div class="title">DUBAI<br>NIGHT RUN</div></div><div class="stats"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">COINS <span id="coins">0</span></div><div class="pill"><span id="fps">—</span> FPS</div></div></div><div class="bottom"><div class="help">Swipe left/right to change lanes. Swipe up to jump. This build deliberately pushes richer geometry, lighting and materials while we watch FPS.</div><button id="start" class="btn">START RUN</button></div></div>
<div id="message" class="center">READY</div><div id="boot"></div>
<script>
(function(){
const boot=document.getElementById('boot');
function fail(err){boot.style.display='block';boot.textContent='RENDER ERROR\n'+(err&&err.message?err.message:String(err));document.getElementById('fps').textContent='ERR';}
try{
if(!window.pc) throw new Error('PlayCanvas library did not load');
const canvas=document.getElementById('game');
const app=new pc.Application(canvas,{keyboard:new pc.Keyboard(window),mouse:new pc.Mouse(canvas),touch:new pc.TouchDevice(canvas),graphicsDeviceOptions:{antialias:true,alpha:false,powerPreference:'high-performance'}});
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);app.start();window.addEventListener('resize',()=>app.resizeCanvas());
app.scene.ambientLight=new pc.Color(.12,.16,.25);app.scene.fog=pc.FOG_LINEAR;app.scene.fogColor=new pc.Color(.025,.045,.085);app.scene.fogStart=55;app.scene.fogEnd=180;if(pc.TONEMAP_ACES!==undefined)app.scene.toneMapping=pc.TONEMAP_ACES;
function mat(r,g,b,metal,gloss,er,eg,eb,ei){const m=new pc.StandardMaterial();m.diffuse=new pc.Color(r,g,b);m.metalness=metal||0;m.gloss=gloss===undefined?.5:gloss;if(ei){m.emissive=new pc.Color(er,eg,eb);m.emissiveIntensity=ei}m.update();return m}
const M={road:mat(.035,.042,.058,.08,.72),road2:mat(.06,.067,.082,.14,.78),line:mat(.72,.8,.96,.05,.7,.35,.5,.95,1.2),glass:mat(.035,.08,.14,.72,.9,.02,.08,.18,.35),glass2:mat(.04,.055,.095,.82,.94,.06,.02,.15,.45),stone:mat(.23,.24,.28,.04,.42),sand:mat(.33,.25,.16,0,.24),gold:mat(.72,.43,.10,.7,.92,.32,.12,.02,.8),cyan:mat(.05,.22,.33,.35,.86,0,.45,1,2.2),pink:mat(.28,.035,.18,.35,.84,1,.02,.5,2.0),warm:mat(.3,.12,.04,.18,.72,1,.35,.06,1.8),skin:mat(.46,.25,.16,0,.42),shirt:mat(.055,.12,.22,.14,.62,.02,.14,.34,.45),black:mat(.018,.023,.034,.12,.5),white:mat(.62,.68,.8,.2,.82,.12,.18,.3,.75),green:mat(.04,.16,.09,.0,.4)};
function prim(type,name,pos,scale,material,parent){const e=new pc.Entity(name);e.addComponent('render',{type:type,castShadows:true,receiveShadows:true});e.render.material=material;e.setPosition(pos[0],pos[1],pos[2]);e.setLocalScale(scale[0],scale[1],scale[2]);(parent||app.root).addChild(e);return e}const box=(...a)=>prim('box',...a),sphere=(...a)=>prim('sphere',...a),cyl=(...a)=>prim('cylinder',...a),cone=(...a)=>prim('cone',...a),caps=(...a)=>prim('capsule',...a);
const cam=new pc.Entity('Camera');cam.addComponent('camera',{clearColor:new pc.Color(.012,.02,.042),fov:64,nearClip:.1,farClip:250});cam.setPosition(0,3.65,7.8);cam.lookAt(0,1,-18);app.root.addChild(cam);
const key=new pc.Entity('Key');key.addComponent('light',{type:'directional',color:new pc.Color(.62,.73,1),intensity:1.65,castShadows:true,shadowResolution:2048,shadowDistance:75,shadowBias:.18});key.setEulerAngles(48,35,0);app.root.addChild(key);
const sunset=new pc.Entity('Sunset');sunset.addComponent('light',{type:'directional',color:new pc.Color(1,.28,.12),intensity:.55});sunset.setEulerAngles(18,-125,0);app.root.addChild(sunset);
const moon=sphere('moon',[35,38,-120],[7,7,7],M.white);
const world=new pc.Entity('World');app.root.addChild(world);
box('road',[0,-.16,-80],[10,.24,185],M.road,world);box('roadshine',[0,-.035,-80],[9.7,.025,185],M.road2,world);box('leftwalk',[-7.3,.02,-80],[4.3,.34,185],M.stone,world);box('rightwalk',[7.3,.02,-80],[4.3,.34,185],M.sand,world);
for(let z=6;z>-170;z-=9){box('dashL',[-1.62,.018,z],[.075,.022,3.1],M.line,world);box('dashR',[1.62,.018,z],[.075,.022,3.1],M.line,world)}
for(let z=3;z>-170;z-=12){box('edgeL',[-5.02,.10,z],[.08,.14,5],M.cyan,world);box('edgeR',[5.02,.10,z],[.08,.14,5],M.warm,world)}
const city=[];
function addWindows(root,x,y,z,h,side,material){for(let yy=2;yy<h-.8;yy+=2.2){for(let zz=-1.25;zz<=1.25;zz+=1.25){box('win',[x+side*.01,yy,z+zz],[.035,.18,.42],material,root)}}}
function makeTower(x,z,h,w,style,side){const r=new pc.Entity('tower');world.addChild(r);if(style===0){box('base',[x,h*.48,z],[w,h,w*.9],M.glass,r);box('crown',[x,h+.7,z],[w*.55,1.4,w*.62],M.gold,r);cone('spire',[x,h+3.2,z],[.35,4.5,.35],M.gold,r)}else if(style===1){cyl('body',[x,h*.48,z],[w,h,w],M.glass2,r);cyl('cap',[x,h+.8,z],[w*.65,1.5,w*.65],M.cyan,r)}else{box('body',[x,h*.45,z],[w,h*.9,w],M.stone,r);box('glassBand',[x-side*w*.505,h*.58,z],[.06,h*.45,w*.88],side<0?M.cyan:M.pink,r);box('top',[x,h+.6,z],[w*.74,1.3,w*.74],M.glass,r)}
addWindows(r,x-side*w*.505,0,z,h,side,side<0?M.cyan:M.warm);r._baseZ=z;r._side=side;city.push(r);return r}
for(let i=0;i<18;i++){const z=-8-i*9.5,h=7+((i*5)%13),side=i%2?-1:1;makeTower(side*(9.3+(i%3)*1.7),z,h,2.6+(i%2)*.45,i%3,side);if(i%3===0)makeTower(-side*(11.2+(i%2)*1.2),z-3,h*.7,2.2,(i+1)%3,-side)}
function palm(x,z){const r=new pc.Entity('palm');world.addChild(r);cyl('trunk',[x,1.55,z],[.18,3.1,.18],M.warm,r);for(let k=0;k<5;k++){const leaf=box('leaf',[x,3.35,z],[1.45,.08,.22],M.green,r);leaf.setEulerAngles(0,k*72,15)}city.push(r);return r}
for(let z=-6;z>-155;z-=17){palm(6.7,z);palm(-6.7,z-8)}
function lamp(x,z,material){const r=new pc.Entity('lamp');world.addChild(r);cyl('pole',[x,1.7,z],[.07,3.4,.07],M.black,r);box('arm',[x-(x>0?.32:-.32),3.35,z],[.65,.07,.07],M.black,r);sphere('bulb',[x-(x>0?.63:-.63),3.28,z],[.12,.12,.12],material,r);city.push(r)}for(let z=-4;z>-165;z-=14){lamp(-5.55,z,M.cyan);lamp(5.55,z-7,M.warm)}
const landmark=new pc.Entity('Burj');world.addChild(landmark);landmark.setPosition(0,0,-138);box('b',[0,5,0],[4.4,10,4.4],M.glass,landmark);box('m',[0,13,0],[3.1,7,3.1],M.glass2,landmark);box('u',[0,20,0],[2.0,7,2.0],M.glass,landmark);cone('s',[0,27,0],[.65,9,.65],M.gold,landmark);
const runner=new pc.Entity('Runner');app.root.addChild(runner);runner.setPosition(0,1.12,2);
caps('torso',[0,.58,0],[.62,1.0,.45],M.shirt,runner);sphere('head',[0,1.42,0],[.42,.47,.42],M.skin,runner);sphere('hair',[0,1.62,-.02],[.42,.18,.4],M.black,runner);const ll=caps('legL',[-.22,-.34,0],[.2,.72,.2],M.black,runner),lr=caps('legR',[.22,-.34,0],[.2,.72,.2],M.black,runner),al=caps('armL',[-.46,.55,0],[.14,.72,.14],M.skin,runner),ar=caps('armR',[.46,.55,0],[.14,.72,.14],M.skin,runner);box('shoeL',[-.22,-.80,.08],[.24,.13,.42],M.white,runner);box('shoeR',[.22,-.80,.08],[.24,.13,.42],M.white,runner);
const lanes=[-3.1,0,3.1],obstacles=[],coinList=[];let lane=1,targetX=0,vy=0,jumping=false,running=false,speed=15,score=0,coins=0,time=0,spawn=0,coinSpawn=0;const scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),fpsEl=document.getElementById('fps'),msg=document.getElementById('message'),start=document.getElementById('start');
function reset(){obstacles.splice(0).forEach(e=>e.destroy());coinList.splice(0).forEach(e=>e.destroy());lane=1;targetX=0;vy=0;jumping=false;runner.setPosition(0,1.12,2);score=coins=time=0;scoreEl.textContent='0';coinsEl.textContent='0'}function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));targetX=lanes[lane]}function jump(){if(!running||jumping)return;jumping=true;vy=7.2}
function startRun(){reset();running=true;start.textContent='RESTART';msg.textContent='GO!';msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),650)}start.addEventListener('click',startRun);window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.code==='Space')jump()});let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});canvas.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dy)>45&&dy<0&&Math.abs(dy)>Math.abs(dx))jump();else if(Math.abs(dx)>35)move(dx>0?1:-1)},{passive:true});
function spawnObs(){const x=lanes[Math.floor(Math.random()*3)],r=new pc.Entity('barrier');app.root.addChild(r);r.setPosition(x,.54,-72);box('bar',[0,.4,0],[1.55,.6,.55],Math.random()>.5?M.pink:M.cyan,r);box('leg1',[-.55,-.22,0],[.12,.45,.12],M.black,r);box('leg2',[.55,-.22,0],[.12,.45,.12],M.black,r);obstacles.push(r)}function spawnCoins(){const x=lanes[Math.floor(Math.random()*3)];for(let i=0;i<5;i++){const e=cyl('coin',[x,1.3,-52-i*3],[.38,.12,.38],M.gold);e.setEulerAngles(90,0,0);coinList.push(e)}}
let fc=0,ft=0;app.on('update',dt=>{fc++;ft+=dt;if(ft>=.5){fpsEl.textContent=Math.round(fc/ft);fc=0;ft=0}const p=runner.getPosition(),tt=performance.now()*.001;cam.setPosition(p.x*.2,3.7+Math.sin(tt*2.3)*.025,7.8);cam.lookAt(p.x*.06,1.02,-16);if(!running)return;time+=dt;speed=Math.min(27,15+time*.24);score+=dt*speed*2.7;scoreEl.textContent=Math.floor(score);let ny=p.y;if(jumping){vy-=17.5*dt;ny+=vy*dt;if(ny<=1.12){ny=1.12;vy=0;jumping=false}}runner.setPosition(pc.math.lerp(p.x,targetX,Math.min(1,dt*10)),ny,2);const sw=Math.sin(time*speed*.62)*34;al.setLocalEulerAngles(sw,0,0);ar.setLocalEulerAngles(-sw,0,0);ll.setLocalEulerAngles(-sw*.78,0,0);lr.setLocalEulerAngles(sw*.78,0,0);
city.forEach(e=>{const q=e.getPosition();e.setPosition(q.x,q.y,q.z+speed*dt);if(q.z>18)e.setPosition(q.x,q.y,q.z-171)});const lz=landmark.getPosition();landmark.setPosition(lz.x,lz.y,lz.z+speed*dt*.17);if(lz.z>-55)landmark.setPosition(0,0,-145);
spawn-=dt;coinSpawn-=dt;if(spawn<=0){spawnObs();spawn=1.0+Math.random()*.72}if(coinSpawn<=0){spawnCoins();coinSpawn=2.25+Math.random()*1.1}for(let i=obstacles.length-1;i>=0;i--){const e=obstacles[i],q=e.getPosition();e.setPosition(q.x,q.y,q.z+speed*dt);if(q.z>8){e.destroy();obstacles.splice(i,1);continue}if(Math.abs(q.z-2)<.9&&Math.abs(q.x-runner.getPosition().x)<1.05&&runner.getPosition().y<1.9){running=false;msg.textContent='CRASH';msg.classList.add('show');start.textContent='RUN AGAIN'}}for(let i=coinList.length-1;i>=0;i--){const e=coinList[i],q=e.getPosition();e.setPosition(q.x,q.y,q.z+speed*dt);e.rotateLocal(0,170*dt,0);if(q.z>8){e.destroy();coinList.splice(i,1);continue}if(Math.abs(q.z-2)<.9&&Math.abs(q.x-runner.getPosition().x)<.9){coins++;coinsEl.textContent=coins;score+=50;e.destroy();coinList.splice(i,1)}}});
msg.textContent='READY';msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),900);
}catch(e){fail(e)}window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason));
})();
</script>
</body>
</html>
