<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Project Star — Dubai Night Run</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101e;font-family:Inter,system-ui,-apple-system,sans-serif}#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}#hud{position:fixed;inset:0;z-index:2;pointer-events:none;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:space-between;text-shadow:0 2px 12px #000}.top{display:flex;justify-content:space-between;gap:10px}.brand{font-size:12px;font-weight:900;letter-spacing:.15em}.title{font-size:clamp(30px,7vw,54px);font-weight:950;line-height:.9;margin-top:8px}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:9px 12px;border-radius:999px;background:rgba(3,8,18,.56);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(12px);font-weight:850;font-size:13px}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.help{max-width:390px;padding:11px 13px;border-radius:16px;background:rgba(3,8,18,.55);border:1px solid rgba(255,255,255,.15);font-size:12px;line-height:1.45}.btn{pointer-events:auto;border:0;border-radius:999px;padding:14px 22px;background:#fff;color:#09101f;font-weight:950;font-size:14px}.center{position:fixed;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:950;font-size:clamp(34px,8vw,72px);color:#fff;text-shadow:0 7px 25px #000;opacity:0;transition:.2s;pointer-events:none}.center.show{opacity:1}#boot{position:fixed;z-index:4;left:50%;top:60%;transform:translateX(-50%);max-width:86vw;padding:10px 14px;border-radius:14px;background:rgba(120,0,0,.85);color:#fff;font-size:12px;display:none;white-space:pre-wrap}@media(max-width:640px){#hud{padding:14px}.title{font-size:31px}.help{max-width:225px;font-size:10.5px}.pill{padding:8px 9px;font-size:12px}.btn{padding:13px 18px}}
</style>
<script src="https://code.playcanvas.com/playcanvas-stable.min.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="top"><div><div class="brand">PROJECT STAR / PLAYCANVAS TEST</div><div class="title">DUBAI<br>NIGHT RUN</div></div><div class="stats"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">COINS <span id="coins">0</span></div><div class="pill"><span id="fps">—</span> FPS</div></div></div><div class="bottom"><div class="help">Swipe left/right to change lanes. Swipe up to jump. A glowing 3D runner and city must be visible before you press Start.</div><button id="start" class="btn">START RUN</button></div></div>
<div id="message" class="center">READY</div><div id="boot"></div>
<script>
(function(){
const boot=document.getElementById('boot');
function fail(err){boot.style.display='block';boot.textContent='RENDER ERROR\n'+(err&&err.message?err.message:String(err));document.getElementById('fps').textContent='ERR';}
try{
if(!window.pc) throw new Error('PlayCanvas library did not load');
const canvas=document.getElementById('game');
const app=new pc.Application(canvas,{keyboard:new pc.Keyboard(window),mouse:new pc.Mouse(canvas),touch:new pc.TouchDevice(canvas),graphicsDeviceOptions:{antialias:true,alpha:false,powerPreference:'high-performance'}});
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);app.start();app.scene.ambientLight=new pc.Color(.24,.28,.42);window.addEventListener('resize',()=>app.resizeCanvas());
function mat(r,g,b,emit){const m=new pc.StandardMaterial();m.diffuse=new pc.Color(r,g,b);m.metalness=.15;m.gloss=.65;if(emit){m.emissive=new pc.Color(r*.7,g*.7,b*.7);m.emissiveIntensity=1.8}m.update();return m}
const M={road:mat(.055,.065,.09),white:mat(.8,.86,.95,true),cyan:mat(.05,.55,.95,true),pink:mat(.92,.08,.55,true),dark:mat(.04,.055,.08),sand:mat(.28,.21,.13),red:mat(.95,.12,.08,true),gold:mat(1,.52,.05,true)};
function box(name,pos,scale,material,parent){const e=new pc.Entity(name);e.addComponent('render',{type:'box'});e.render.material=material;e.setPosition(pos[0],pos[1],pos[2]);e.setLocalScale(scale[0],scale[1],scale[2]);(parent||app.root).addChild(e);return e}
function sphere(name,pos,scale,material,parent){const e=new pc.Entity(name);e.addComponent('render',{type:'sphere'});e.render.material=material;e.setPosition(pos[0],pos[1],pos[2]);e.setLocalScale(scale[0],scale[1],scale[2]);(parent||app.root).addChild(e);return e}
const cam=new pc.Entity('Camera');cam.addComponent('camera',{clearColor:new pc.Color(.018,.035,.075),fov:62,nearClip:.1,farClip:260});cam.setPosition(0,4.1,8.5);cam.lookAt(0,1,-18);app.root.addChild(cam);
const sun=new pc.Entity('Key');sun.addComponent('light',{type:'directional',color:new pc.Color(.62,.72,1),intensity:1.55,castShadows:true,shadowResolution:1024});sun.setEulerAngles(52,34,0);app.root.addChild(sun);
const rim=new pc.Entity('Rim');rim.addComponent('light',{type:'directional',color:new pc.Color(1,.28,.55),intensity:.75});rim.setEulerAngles(15,-125,0);app.root.addChild(rim);
box('road',[0,-.2,-72],[10,.25,165],M.road);box('leftwalk',[-7.2,0,-72],[4,.35,165],M.dark);box('rightwalk',[7.2,0,-72],[4,.35,165],M.sand);
for(let z=4;z>-150;z-=8){box('dashL',[-1.65,.03,z],[.09,.03,3.2],M.white);box('dashR',[1.65,.03,z],[.09,.03,3.2],M.white)}
const movers=[];
for(let i=0;i<20;i++){const z=-8-i*8;const h=5+(i*7)%15;const l=box('L'+i,[-9.5-(i%3)*1.4,h/2,z],[2.8,h,4],i%2?M.dark:M.cyan);const r=box('R'+i,[9.5+(i%3)*1.3,(h+2)/2,z],[3,h+2,4],i%2?M.pink:M.dark);movers.push(l,r)}
const runner=new pc.Entity('Runner');app.root.addChild(runner);runner.setPosition(0,1.0,2);sphere('head',[0,1.38,0],[.48,.52,.48],M.gold,runner);box('body',[0,.55,0],[.9,1.3,.52],M.red,runner);const ll=box('legL',[-.25,-.38,0],[.23,.82,.25],M.dark,runner),lr=box('legR',[.25,-.38,0],[.23,.82,.25],M.dark,runner),al=box('armL',[-.58,.55,0],[.18,.9,.18],M.red,runner),ar=box('armR',[.58,.55,0],[.18,.9,.18],M.red,runner);
box('bootProof',[0,1.1,-7],[2.2,2.2,2.2],M.cyan);
const lanes=[-3.1,0,3.1],obstacles=[],coinList=[];let lane=1,targetX=0,vy=0,jumping=false,running=false,speed=15,score=0,coins=0,time=0,spawn=0,coinSpawn=0;const scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),fpsEl=document.getElementById('fps'),msg=document.getElementById('message'),start=document.getElementById('start');
function reset(){obstacles.splice(0).forEach(e=>e.destroy());coinList.splice(0).forEach(e=>e.destroy());lane=1;targetX=0;vy=0;jumping=false;runner.setPosition(0,1,2);score=coins=time=0;scoreEl.textContent='0';coinsEl.textContent='0'}
function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));targetX=lanes[lane]}function jump(){if(!running||jumping)return;jumping=true;vy=7.2}
function startRun(){reset();running=true;start.textContent='RESTART';msg.textContent='GO!';msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),650)}start.addEventListener('click',startRun);
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key==='ArrowUp'||e.code==='Space')jump()});let sx=0,sy=0;canvas.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY},{passive:true});canvas.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dy)>45&&dy<0&&Math.abs(dy)>Math.abs(dx))jump();else if(Math.abs(dx)>35)move(dx>0?1:-1)},{passive:true});
function spawnObs(){const e=box('obs',[lanes[Math.floor(Math.random()*3)],.7,-70],[1.6,1.4,1.2],Math.random()>.5?M.pink:M.cyan);obstacles.push(e)}function spawnCoins(){const x=lanes[Math.floor(Math.random()*3)];for(let i=0;i<5;i++){const e=sphere('coin',[x,1.25,-50-i*3],[.36,.36,.18],M.gold);coinList.push(e)}}
let fc=0,ft=0;app.on('update',dt=>{fc++;ft+=dt;if(ft>=.5){fpsEl.textContent=Math.round(fc/ft);fc=0;ft=0}const p=runner.getPosition();cam.setPosition(p.x*.18,4.1,8.5);cam.lookAt(p.x*.08,1,-15);document.getElementsByName;if(!running)return;time+=dt;speed=Math.min(26,15+time*.25);score+=dt*speed*2.6;scoreEl.textContent=Math.floor(score);let ny=p.y;vy-=jumping?17.5*dt:0;if(jumping){ny+=vy*dt;if(ny<=1){ny=1;vy=0;jumping=false}}runner.setPosition(pc.math.lerp(p.x,targetX,Math.min(1,dt*10)),ny,2);const sw=Math.sin(time*speed*.6)*35;al.setLocalEulerAngles(sw,0,0);ar.setLocalEulerAngles(-sw,0,0);ll.setLocalEulerAngles(-sw*.75,0,0);lr.setLocalEulerAngles(sw*.75,0,0);movers.forEach(e=>{const q=e.getPosition();e.setPosition(q.x,q.y,q.z+speed*dt);if(q.z>14)e.setPosition(q.x,q.y,-150)});spawn-=dt;coinSpawn-=dt;if(spawn<=0){spawnObs();spawn=.95+Math.random()*.7}if(coinSpawn<=0){spawnCoins();coinSpawn=2.2+Math.random()*1.2}for(let i=obstacles.length-1;i>=0;i--){const e=obstacles[i],q=e.getPosition();e.setPosition(q.x,q.y,q.z+speed*dt);if(q.z>8){e.destroy();obstacles.splice(i,1);continue}if(Math.abs(q.z-2)<.9&&Math.abs(q.x-runner.getPosition().x)<1.1&&runner.getPosition().y<2){running=false;msg.textContent='CRASH';msg.classList.add('show');start.textContent='RUN AGAIN'}}for(let i=coinList.length-1;i>=0;i--){const e=coinList[i],q=e.getPosition();e.setPosition(q.x,q.y,q.z+speed*dt);if(q.z>8){e.destroy();coinList.splice(i,1);continue}if(Math.abs(q.z-2)<.9&&Math.abs(q.x-runner.getPosition().x)<.9){coins++;coinsEl.textContent=coins;score+=50;e.destroy();coinList.splice(i,1)}}});
msg.textContent='READY';msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),900);
}catch(e){fail(e);}
window.addEventListener('error',e=>fail(e.error||e.message));window.addEventListener('unhandledrejection',e=>fail(e.reason));
})();
</script>
</body>
</html>
