<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Project Star — Dubai Night Run</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b14;font-family:Inter,system-ui,-apple-system,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:18px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7)}.top{display:flex;justify-content:space-between;gap:12px}.brand{font-size:12px;font-weight:800;letter-spacing:.14em}.title{font-size:clamp(26px,5vw,54px);line-height:.92;font-weight:900;margin-top:7px}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{background:rgba(7,10,20,.48);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:800}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.help{max-width:390px;background:rgba(7,10,20,.44);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(12px);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.45}.btn{pointer-events:auto;border:0;border-radius:999px;padding:13px 20px;background:#fff;color:#101225;font-weight:900}.msg{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);font-size:clamp(38px,8vw,76px);font-weight:950;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.7);opacity:0;transition:.2s}.msg.show{opacity:1}@media(max-width:640px){.help{max-width:235px;font-size:11px}.pill{padding:8px 9px}.title{font-size:30px}}
  </style>
  <script type="importmap">{"imports":{"playcanvas":"https://cdn.jsdelivr.net/npm/playcanvas@latest/build/playcanvas.mjs"}}</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="top"><div><div class="brand">PROJECT STAR / PLAYCANVAS TEST</div><div class="title">DUBAI<br>NIGHT RUN</div></div><div class="stats"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">COINS <span id="coins">0</span></div><div class="pill"><span id="fps">60</span> FPS</div></div></div><div class="bottom"><div class="help">Swipe or use ← → to change lanes. Swipe up or press ↑ / Space to jump. Procedural 3D only — no gameplay video.</div><button id="start" class="btn">START RUN</button></div></div>
<div id="message" class="msg">READY</div>
<script type="module">
import * as pc from 'playcanvas';
const canvas=document.getElementById('game'),scoreEl=document.getElementById('score'),coinsEl=document.getElementById('coins'),fpsEl=document.getElementById('fps'),startBtn=document.getElementById('start'),msg=document.getElementById('message');
const app=new pc.Application(canvas,{keyboard:new pc.Keyboard(window),mouse:new pc.Mouse(canvas),touch:new pc.TouchDevice(canvas),graphicsDeviceOptions:{antialias:true,alpha:false,powerPreference:'high-performance'}});app.start();app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);app.scene.ambientLight=new pc.Color(.18,.20,.31);app.scene.fog=pc.FOG_LINEAR;app.scene.fogColor=new pc.Color(.075,.085,.15);app.scene.fogStart=45;app.scene.fogEnd=210;window.addEventListener('resize',()=>app.resizeCanvas(canvas.clientWidth,canvas.clientHeight));
const material=(r,g,b,metal=0,gloss=.5,emissive)=>{const m=new pc.StandardMaterial();m.diffuse=new pc.Color(r,g,b);m.metalness=metal;m.gloss=gloss;if(emissive){m.emissive=new pc.Color(...emissive);m.emissiveIntensity=2.5}m.update();return m};
const M={road:material(.07,.075,.095,.1,.35),curb:material(.19,.20,.24,.15,.5),sand:material(.44,.32,.20,0,.2),glass:material(.055,.10,.16,.75,.82),dark:material(.055,.06,.085,.15,.35),red:material(.92,.22,.12,0,.55),black:material(.035,.04,.055,.1,.5),gold:material(.95,.60,.08,.65,.9,[.22,.08,0]),cyan:material(.08,.52,.76,.35,.8,[0,.20,.55]),magenta:material(.70,.09,.44,.25,.75,[.38,0,.15]),white:material(.78,.84,.93,.2,.75,[.35,.45,.65])};
function prim(type,name,pos,scale,mat,parent=app.root){const e=new pc.Entity(name);e.addComponent('render',{type,castShadows:true,receiveShadows:true});e.setPosition(...pos);e.setLocalScale(...scale);e.render.material=mat;parent.addChild(e);return e}const box=(...a)=>prim('box',...a),sphere=(...a)=>prim('sphere',...a),cyl=(...a)=>prim('cylinder',...a);
const cam=new pc.Entity('Camera');cam.addComponent('camera',{clearColor:new pc.Color(.06,.07,.13),fov:64,nearClip:.1,farClip:300});cam.setPosition(0,4.2,8.6);app.root.addChild(cam);
const moon=new pc.Entity('Moon');moon.addComponent('light',{type:'directional',color:new pc.Color(.67,.75,1),intensity:1.7,castShadows:true,shadowResolution:2048,shadowDistance:75,shadowBias:.2});moon.setEulerAngles(48,28,0);app.root.addChild(moon);const warm=new pc.Entity('Warm');warm.addComponent('light',{type:'directional',color:new pc.Color(1,.45,.22),intensity:.65});warm.setEulerAngles(18,-135,0);app.root.addChild(warm);
const segLen=30,segments=[];for(let i=0;i<10;i++){const root=new pc.Entity('seg');app.root.addChild(root);root.setPosition(0,0,-i*segLen);box('road',[0,-.12,0],[10,.22,segLen],M.road,root);box('walkL',[-7.2,.02,0],[4.1,.35,segLen],M.curb,root);box('walkR',[7.2,.02,0],[4.1,.35,segLen],M.sand,root);for(let z=-12;z<=12;z+=8){box('dash',[-1.65,.015,z],[.09,.02,3.4],M.white,root);box('dash',[1.65,.015,z],[.09,.02,3.4],M.white,root)}for(let z=-13;z<=13;z+=5){box('nl',[-5.05,.28,z],[.12,.12,.7],M.cyan,root);box('nr',[5.05,.28,z],[.12,.12,.7],M.magenta,root)}for(let j=0;j<4;j++){const z=-11+j*7.2,h=6+((i*7+j*11)%9);box('towerL',[-10-(j%2)*2.3,h/2,z],[3.2,h,3.5],j%2?M.glass:M.dark,root);box('towerR',[10.5+(j%2)*2.6,(h+3)/2,z],[3.6,h+3,3.8],j%2?M.dark:M.glass,root);for(let y=2;y<h;y+=2.2)box('win',[-8.35-(j%2)*2.3,y,z],[.05,.12,2.5],j%2?M.magenta:M.cyan,root);if(j%2===0){cyl('palm',[6.7,1.6,z+2],[.28,3.2,.28],M.dark,root);sphere('crown',[6.7,3.4,z+2],[1.25,.42,1.25],M.dark,root)}}segments.push(root)}
const landmark=new pc.Entity('landmark');app.root.addChild(landmark);landmark.setPosition(0,0,-125);box('b',[0,7,0],[5.2,14,5.2],M.glass,landmark);box('m',[0,17,0],[3.2,10,3.2],M.glass,landmark);box('t',[0,25,0],[1.7,8,1.7],M.glass,landmark);box('s',[0,31,0],[.28,7,.28],M.white,landmark);
const runner=new pc.Entity('Runner');app.root.addChild(runner);runner.setPosition(0,.9,2);sphere('head',[0,1.35,0],[.46,.52,.46],material(.46,.25,.16,0,.35),runner);box('torso',[0,.55,0],[.85,1.25,.48],M.red,runner);box('legL',[-.24,-.38,0],[.24,.82,.25],M.black,runner);box('legR',[.24,-.38,0],[.24,.82,.25],M.black,runner);box('armL',[-.58,.55,0],[.18,.9,.18],M.red,runner);box('armR',[.58,.55,0],[.18,.9,.18],M.red,runner);
const lanes=[-3.25,0,3.25],obs=[],coinItems=[];let lane=1,targetX=0,vy=0,jumping=false,running=false,speed=16,score=0,coins=0,elapsed=0,spawnClock=0,coinClock=0,fpsClock=0,fpsFrames=0;
function spawnObstacle(){const ln=Math.floor(Math.random()*3),e=box('obstacle',[lanes[ln],.65,-110],[1.65,1.3,1.1],Math.random()>.5?M.magenta:M.cyan);obs.push(e)}function spawnCoins(){const ln=Math.floor(Math.random()*3);for(let i=0;i<5;i++){const e=cyl('coin',[lanes[ln],1.2,-75-i*3],[.48,.11,.48],M.gold);e.setEulerAngles(90,0,0);coinItems.push(e)}}function reset(){obs.splice(0).forEach(e=>e.destroy());coinItems.splice(0).forEach(e=>e.destroy());lane=1;targetX=0;vy=0;jumping=false;runner.setPosition(0,.9,2);speed=16;score=coins=elapsed=spawnClock=coinClock=0;scoreEl.textContent='0';coinsEl.textContent='0'}function start(){reset();running=true;startBtn.textContent='RESTART';msg.textContent='GO!';msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),650)}startBtn.addEventListener('click',start);function move(d){if(!running)return;lane=Math.max(0,Math.min(2,lane+d));targetX=lanes[lane]}function jump(){if(!running||jumping)return;jumping=true;vy=7.1}window.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')move(-1);if(e.code==='ArrowRight'||e.code==='KeyD')move(1);if(e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')jump()});let sx=0,sy=0;canvas.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});canvas.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dy)>45&&dy<0&&Math.abs(dy)>Math.abs(dx))jump();else if(Math.abs(dx)>38)move(dx>0?1:-1)});function crash(){running=false;msg.textContent='CRASH';msg.classList.add('show');startBtn.textContent='RUN AGAIN'}
app.on('update',dt=>{fpsClock+=dt;fpsFrames++;if(fpsClock>=.5){fpsEl.textContent=String(Math.round(fpsFrames/fpsClock));fpsClock=0;fpsFrames=0}const t=performance.now()*.001,p=runner.getPosition();cam.setPosition(p.x*.24,4.25+Math.sin(t*2.4)*.04,8.6);cam.lookAt(p.x*.08,1.05,-8);if(!running)return;elapsed+=dt;speed=Math.min(27,16+elapsed*.22);score+=dt*speed*2.8;scoreEl.textContent=String(Math.floor(score));const rp=runner.getPosition(),nx=pc.math.lerp(rp.x,targetX,Math.min(1,dt*10));let ny=rp.y;if(jumping){vy-=17.5*dt;ny+=vy*dt;if(ny<=.9){ny=.9;vy=0;jumping=false}}runner.setPosition(nx,ny,2);const swing=Math.sin(elapsed*speed*.62)*34;runner.findByName('armL').setLocalEulerAngles(swing,0,0);runner.findByName('armR').setLocalEulerAngles(-swing,0,0);runner.findByName('legL').setLocalEulerAngles(-swing*.75,0,0);runner.findByName('legR').setLocalEulerAngles(swing*.75,0,0);segments.forEach(s=>{const sp=s.getPosition();s.setPosition(sp.x,sp.y,sp.z+speed*dt);if(sp.z>segLen){let min=Infinity;segments.forEach(q=>min=Math.min(min,q.getPosition().z));s.setPosition(0,0,min-segLen)}});const lp=landmark.getPosition();landmark.setPosition(lp.x,lp.y,lp.z+speed*dt*.18);if(lp.z>-55)landmark.setPosition(0,0,-140);spawnClock-=dt;coinClock-=dt;if(spawnClock<=0){spawnObstacle();spawnClock=1+Math.random()*.7}if(coinClock<=0){spawnCoins();coinClock=2.2+Math.random()*1.3}for(let i=obs.length-1;i>=0;i--){const e=obs[i],ep=e.getPosition();e.setPosition(ep.x,ep.y,ep.z+speed*dt);if(ep.z>7){e.destroy();obs.splice(i,1);continue}if(Math.abs(ep.z-2)<.85&&Math.abs(ep.x-nx)<1.15&&ny<2){crash();break}}for(let i=coinItems.length-1;i>=0;i--){const e=coinItems[i],ep=e.getPosition();e.setPosition(ep.x,ep.y,ep.z+speed*dt);e.rotateLocal(0,150*dt,0);if(ep.z>7){e.destroy();coinItems.splice(i,1);continue}if(Math.abs(ep.z-2)<.95&&Math.abs(ep.x-nx)<1&&Math.abs(ep.y-ny)<1.25){coins++;coinsEl.textContent=String(coins);score+=50;e.destroy();coinItems.splice(i,1)}}});setTimeout(()=>{msg.textContent='READY';msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),900)},450);
</script>
</body></html>
